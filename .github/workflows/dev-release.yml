name: Dev Build and Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build-release
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install --yes ant

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync branch state
        run: |
          branch="${{ github.ref_name }}"
          git fetch origin "${branch}" --tags
          git checkout "${branch}"
          git pull --rebase origin "${branch}"

      - name: Bump EDITION semver patch
        id: bump
        run: |
          current_version="$(tr -d '\r\n' < EDITION)"
          next_version="$(python3 - <<'PY'
          import re
          from pathlib import Path

          current = Path("EDITION").read_text(encoding="utf-8").strip()
          match = re.match(r'^(\d+)\.(\d+)\.(\d+)(?:[-+][0-9A-Za-z.-]+)?$', current)

          # Backward-compatible fallback for legacy values like 2.0.1beta.
          if not match:
              match = re.match(r'^(\d+)\.(\d+)\.(\d+)[0-9A-Za-z.-]*$', current)

          if not match:
              raise SystemExit(f"EDITION must start with semantic version X.Y.Z, got: {current!r}")

          major, minor, patch = map(int, match.groups())
          print(f"{major}.{minor}.{patch + 1}")
          PY
          )"

          printf "%s" "${next_version}" > EDITION

          echo "previous_version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next_version}" >> "$GITHUB_OUTPUT"

      - name: Build and test project
        run: ant -f build.xml test

      - name: Build release archives
        run: ant -f buildRelease.xml all

      - name: Bundle built test pages
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import tarfile
          import zipfile
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          version = os.environ["RELEASE_VERSION"]
          test_dir = workspace / "test"

          required_paths = [
              test_dir / "search.html",
              test_dir / "search-debug.html",
              test_dir / "ssTest",
          ]
          missing = [str(path) for path in required_paths if not path.exists()]
          if missing:
              raise SystemExit(f"Missing expected test outputs: {', '.join(missing)}")

          dist_dir = workspace / "dist"
          dist_dir.mkdir(parents=True, exist_ok=True)

          bundle_root_name = f"staticSearch-test-pages_{version}"
          staging_dir = workspace / "_bundle_test_pages"
          if staging_dir.exists():
              shutil.rmtree(staging_dir)

          staged_bundle_root = staging_dir / bundle_root_name
          shutil.copytree(test_dir, staged_bundle_root)

          tar_path = dist_dir / f"{bundle_root_name}.tar.gz"
          with tarfile.open(tar_path, "w:gz") as tar_file:
              tar_file.add(staged_bundle_root, arcname=bundle_root_name)

          zip_path = dist_dir / f"{bundle_root_name}.zip"
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as zip_file:
              for source_path in staged_bundle_root.rglob("*"):
                  if source_path.is_file():
                      archive_path = source_path.relative_to(staging_dir)
                      zip_file.write(source_path, archive_path)

          shutil.rmtree(staging_dir)
          print(f"Created {tar_path}")
          print(f"Created {zip_path}")
          PY
        env:
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}

      - name: Commit and push EDITION
        if: github.ref_name == 'dev'
        run: |
          if git diff --quiet -- EDITION; then
            echo "No EDITION changes detected."
            exit 0
          fi
          git add EDITION
          git commit -m "ci: bump EDITION to ${{ steps.bump.outputs.version }}"
          git push origin HEAD:dev

      - name: Create and push release tag
        if: github.ref_name == 'dev'
        run: |
          tag="${{ steps.bump.outputs.tag }}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "Tag ${tag} already exists on origin; reusing it."
            exit 0
          fi
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

      - name: Create GitHub prerelease
        if: github.ref_name == 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
