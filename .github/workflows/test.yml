# =============================================================================
# Test staticSearch
# =============================================================================
# On push (except dev): build with Ant, run Playwright browser tests, and
# deploy a feature preview to GitHub Pages when the branch has an open PR.
# On PR closed or branch delete: remove that branch's preview and prune
# any orphaned previews. The pages-content branch holds previews at
# previews/branch-<branch>/ and is deployed as a single GitHub Pages site.
# =============================================================================

name: Test staticSearch
on:
  push:
  pull_request:
    types:
      - closed
  delete:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Build the project and produce the test site (test/search.html, etc.).
  # Only on push to non-dev branches. Uploads artifact for browser job and
  # deploy-feature-preview.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    if: github.event_name == 'push' && github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Self checkout
        uses: actions/checkout@v4

      # Ant build produces test/ with search.html, search-debug.html, ssTest.
      - name: Build test site
        run: ant -f "${{ github.workspace }}/build.xml" all makeDebugSearchPage

      # Fail the job if expected outputs are missing.
      - name: Verify test site outputs
        run: |
          test -f "${GITHUB_WORKSPACE}/test/search.html"
          test -f "${GITHUB_WORKSPACE}/test/search-debug.html"
          test -d "${GITHUB_WORKSPACE}/test/ssTest"

      # Persist test/ for the browser job and deploy-feature-preview.
      - name: Save built test site artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-test-site
          path: ${{ github.workspace }}/test
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Run Playwright tests against the built test site (Chromium). Only on push
  # to non-dev. Depends on build artifact.
  # ---------------------------------------------------------------------------
  browser:
    name: Browser Test
    if: github.event_name == 'push' && github.ref != 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Self checkout
        uses: actions/checkout@v4

      - name: Restore built test site artifact
        uses: actions/download-artifact@v4
        with:
          name: built-test-site
          path: ${{ github.workspace }}/artifact-test

      # Artifact may be workspace/test or artifact-test/test; normalize to workspace/test.
      - name: Normalize built test site artifact
        run: |
          src="${GITHUB_WORKSPACE}/artifact-test"
          if [ -d "${src}/test" ]; then
            src="${src}/test"
          fi

          rm -rf "${GITHUB_WORKSPACE}/test"
          mkdir -p "${GITHUB_WORKSPACE}/test"
          cp -R "${src}/." "${GITHUB_WORKSPACE}/test/"

      - name: Setup node
        uses: actions/setup-node@v4

      - name: Install Playwright
        run: npm install @playwright/test @types/node

      # Chromium only; config in ci/playwright.config.js.
      - name: Install Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test --config "${{ github.workspace }}/ci/playwright.config.js"

      # Upload results on pass or fail for debugging (e.g. screenshots).
      - name: Save test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ github.workspace }}/ci/test-results
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Deploy this branch's build to GitHub Pages as a feature preview, only when
  # there is an open PR for this branch. Writes to pages-content at
  # previews/branch-<branch>/ and deploys the full pages-content site.
  # ---------------------------------------------------------------------------
  deploy-feature-preview:
    name: Deploy Feature Preview
    if: github.event_name == 'push' && github.ref != 'refs/heads/dev'
    needs: build
    concurrency:
      group: pages-content
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: read
    environment:
      name: github-pages
      url: ${{ format('https://{0}.github.io/{1}/previews/branch-{2}/search.html', github.repository_owner, github.event.repository.name, github.ref_name) }}
    steps:
      - name: Self checkout
        uses: actions/checkout@v4

      # If no open PR has head = this branch, we skip deploy (no preview URL to maintain).
      - name: Check for open pull request on this branch
        id: open_pr_for_branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.BRANCH_NAME;
            const openPulls = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branch}`,
                per_page: 100
              }
            );
            const hasOpenPr = openPulls.length > 0;
            core.setOutput('has_open_pr', hasOpenPr ? 'true' : 'false');
            core.setOutput('numbers', openPulls.map(pr => String(pr.number)).join(','));
        env:
          BRANCH_NAME: ${{ github.ref_name }}

      - name: Skip preview deploy when no open PR exists
        if: steps.open_pr_for_branch.outputs.has_open_pr != 'true'
        run: |
          echo "No open PR found for branch ${GITHUB_REF_NAME}; skipping preview deploy."

      # Required before deploy-pages.
      - name: Configure GitHub Pages
        if: steps.open_pr_for_branch.outputs.has_open_pr == 'true'
        uses: actions/configure-pages@v5

      # Use the same built test site as the browser job (from build artifact).
      - name: Restore built test site artifact
        if: steps.open_pr_for_branch.outputs.has_open_pr == 'true'
        uses: actions/download-artifact@v4
        with:
          name: built-test-site
          path: ${{ github.workspace }}/artifact-test

      # Clone branch that stores previews + staging + test; create if missing.
      - name: Checkout pages content branch
        id: checkout_pages_content
        if: steps.open_pr_for_branch.outputs.has_open_pr == 'true'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: pages-content
          fetch-depth: 0
          path: pages-content

      # First-time setup: init repo, .nojekyll, initial commit, push pages-content.
      - name: Initialize pages content branch if missing
        if: steps.open_pr_for_branch.outputs.has_open_pr == 'true' && steps.checkout_pages_content.outcome != 'success'
        run: |
          mkdir -p pages-content
          cd pages-content
          if [ ! -d .git ]; then
            git init
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git checkout -B pages-content
          touch .nojekyll
          git add .nojekyll
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            git commit -m "ci: initialize pages-content store"
          elif ! git diff --cached --quiet; then
            git commit -m "ci: initialize pages-content store"
          fi
          git push -u origin pages-content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Write built test site to previews/branch-<branch>/ on pages-content; push with rebase retry (3x).
      - name: Update pages content for feature branch
        if: steps.open_pr_for_branch.outputs.has_open_pr == 'true'
        shell: bash
        run: |
          branch_path="${GITHUB_REF_NAME}"
          src="${GITHUB_WORKSPACE}/artifact-test"
          if [ -d "${src}/test" ]; then
            src="${src}/test"
          fi
          test -f "${src}/search.html"
          test -f "${src}/search-debug.html"
          test -d "${src}/ssTest"

          cd pages-content
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          push_with_rebase_retry() {
            for attempt in 1 2 3; do
              if git push origin HEAD:pages-content; then
                return 0
              fi

              if [ "${attempt}" -eq 3 ]; then
                return 1
              fi

              echo "Push failed on attempt ${attempt}; rebasing onto latest pages-content."
              git fetch origin pages-content
              git rebase origin/pages-content
            done
          }

          mkdir -p previews
          rm -rf "previews/branch-${branch_path}"
          mkdir -p "previews/branch-${branch_path}"
          cp -R "${src}/." "previews/branch-${branch_path}/"
          printf '%s' "${branch_path}" > "previews/branch-${branch_path}/.preview-branch-ref"

          git add -A
          if git diff --cached --quiet; then
            echo "No pages-content changes to commit."
          else
            git commit -m "ci: update preview for ${GITHUB_REF_NAME}"
            push_with_rebase_retry
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Copy full pages-content (all previews + staging + test) into site/ for deployment (no .git).
      - name: Assemble site from pages content
        if: steps.open_pr_for_branch.outputs.has_open_pr == 'true'
        run: |
          rm -rf site
          mkdir -p site
          cp -R pages-content/. site/
          rm -rf site/.git
          echo "Feature preview path: previews/branch-${GITHUB_REF_NAME}/search.html"

      - name: Upload Pages artifact
        if: steps.open_pr_for_branch.outputs.has_open_pr == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # Publish so preview is available at .../previews/branch-<branch>/search.html.
      - name: Deploy to GitHub Pages
        if: steps.open_pr_for_branch.outputs.has_open_pr == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # When a PR is closed or a branch is deleted, remove that branch's preview
  # from pages-content (previews/branch-<branch>/) and redeploy.
  # ---------------------------------------------------------------------------
  cleanup-feature-preview:
    name: Cleanup Feature Preview
    if: (github.event_name == 'delete' && github.event.ref_type == 'branch') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: pages-content
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Checkout pages content branch
        id: checkout_pages_content
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: pages-content
          fetch-depth: 0
          path: pages-content

      # Delete previews/branch-<branch> for the closed PR or deleted branch; push with retry.
      - name: Remove closed/deleted branch preview from pages content
        id: cleanup_store
        if: steps.checkout_pages_content.outcome == 'success'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            branch_path="${{ github.event.pull_request.head.ref }}"
            reason="closed PR #${{ github.event.pull_request.number }}"
          else
            branch_path="${{ github.event.ref }}"
            reason="deleted branch ${branch_path}"
          fi

          cd pages-content
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          push_with_rebase_retry() {
            for attempt in 1 2 3; do
              if git push origin HEAD:pages-content; then
                return 0
              fi

              if [ "${attempt}" -eq 3 ]; then
                return 1
              fi

              echo "Push failed on attempt ${attempt}; rebasing onto latest pages-content."
              git fetch origin pages-content
              git rebase origin/pages-content
            done
          }

          rm -rf "previews/branch-${branch_path}"
          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "ci: remove preview for ${reason}"
          push_with_rebase_retry
          echo "changed=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild site only when we actually removed a preview dir.
      - name: Assemble site from pages content
        if: steps.cleanup_store.outputs.changed == 'true'
        run: |
          rm -rf site
          mkdir -p site
          cp -R pages-content/. site/
          rm -rf site/.git

      - name: Upload Pages artifact
        if: steps.cleanup_store.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        if: steps.cleanup_store.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

  prune-orphaned-feature-previews:
    name: Prune Orphaned Feature Previews
    if: always() && (github.event_name == 'push' || github.event_name == 'delete' || (github.event_name == 'pull_request' && github.event.action == 'closed'))
    needs:
      - deploy-feature-preview
      - cleanup-feature-preview
    concurrency:
      group: pages-content
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Checkout pages content branch
        id: checkout_pages_content
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: pages-content
          fetch-depth: 0
          path: pages-content

      # Branch refs (e.g. feature/foo) that still have an open PR; others are orphaned.
      - name: List open pull request branch refs
        id: open_prs
        uses: actions/github-script@v7
        with:
          script: |
            const openPulls = await github.paginate(
              github.rest.pulls.list,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              }
            );
            const sameRepoRefs = openPulls
              .filter(pr => pr.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`)
              .map(pr => pr.head.ref);
            core.setOutput('refs', sameRepoRefs.join('\n'));

      # Delete previews/branch-<ref> for refs not in the open PR list; commit and push with retry.
      - name: Remove orphaned feature previews
        id: prune_previews
        if: steps.checkout_pages_content.outcome == 'success'
        shell: bash
        run: |
          cd pages-content
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          push_with_rebase_retry() {
            for attempt in 1 2 3; do
              if git push origin HEAD:pages-content; then
                return 0
              fi

              if [ "${attempt}" -eq 3 ]; then
                return 1
              fi

              echo "Push failed on attempt ${attempt}; rebasing onto latest pages-content."
              git fetch origin pages-content
              git rebase origin/pages-content
            done
          }

          if [ ! -d previews ]; then
            echo "No feature previews found."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open_refs=$'\n'"${{ steps.open_prs.outputs.refs }}"$'\n'
          changed=false

          while IFS= read -r metadata_file; do
            [ -f "${metadata_file}" ] || continue
            preview_dir="$(dirname "${metadata_file}")"
            branch_path="$(tr -d '\r' < "${metadata_file}")"
            [ -n "${branch_path}" ] || continue

            if [[ "${open_refs}" != *$'\n'"${branch_path}"$'\n'* ]]; then
              echo "Removing orphaned feature preview ${preview_dir}"
              rm -rf "${preview_dir}"
              changed=true
            fi
          done < <(find previews -type f -name .preview-branch-ref)

          # Backward-compatible sweep for previews created before .preview-branch-ref existed.
          while IFS= read -r search_file; do
            [ -f "${search_file}" ] || continue
            preview_dir="$(dirname "${search_file}")"
            [ -f "${preview_dir}/.preview-branch-ref" ] && continue
            [ -f "${preview_dir}/search-debug.html" ] || continue
            [ -d "${preview_dir}/ssTest" ] || continue

            branch_path="${preview_dir#previews/branch-}"
            if [ "${branch_path}" = "${preview_dir}" ]; then
              continue
            fi

            if [[ "${open_refs}" != *$'\n'"${branch_path}"$'\n'* ]]; then
              echo "Removing orphaned legacy feature preview ${preview_dir}"
              rm -rf "${preview_dir}"
              changed=true
            fi
          done < <(find previews -type f -name search.html)

          git add -A
          if git diff --cached --quiet; then
            echo "No orphaned feature previews found."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "ci: remove orphaned feature previews"
          push_with_rebase_retry
          echo "changed=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild and upload only when we removed at least one orphaned preview.
      - name: Assemble site from pages content
        if: steps.prune_previews.outputs.changed == 'true'
        run: |
          rm -rf site
          mkdir -p site
          cp -R pages-content/. site/
          rm -rf site/.git

      - name: Upload Pages artifact
        if: steps.prune_previews.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        if: steps.prune_previews.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
