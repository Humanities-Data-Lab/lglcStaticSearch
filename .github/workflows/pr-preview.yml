# =============================================================================
# PR Preview Pages
# =============================================================================
# When a PR from the same repo is merged, this workflow promotes its branch
# preview (from the pages-content branch) into a permanent "staging" URL so
# the merged result stays viewable at .../staging/pr-<number>/search.html.
# A second job then removes staging folders for PRs that are no longer open
# (orphaned staging pages).
# =============================================================================

name: PR Preview Pages

# Runs when any pull request is closed (merged or not).
on:
  pull_request_target:
    types:
      - closed

# Needed to push to pages-content and deploy to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: read

# One run per PR number; a new close cancels the previous run for that PR.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Promote merged PR's branch preview to staging (permanent preview URL).
  # Only runs when: PR was merged (not just closed) and head is from this repo.
  # ---------------------------------------------------------------------------
  promote-merged-preview:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: pages-content
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ format('https://{0}.github.io/{1}/staging/pr-{2}/search.html', github.repository_owner, github.event.repository.name, github.event.pull_request.number) }}
    steps:
      # Prepare the runner for GitHub Pages deployment (required before deploy-pages).
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Clone the pages-content branch (holds previews + staging; separate from main repo).
      - name: Checkout pages content branch
        uses: actions/checkout@v4
        with:
          ref: pages-content
          fetch-depth: 0
          path: pages-content

      # Copy previews/branch-<branch> to staging/pr-<number>, commit and push to pages-content.
      # Uses up to 3 attempts: on push conflict, fetches latest pages-content and retries.
      - name: Promote branch preview to staging
        shell: bash
        run: |
          branch_path="${{ github.event.pull_request.head.ref }}"
          preview_dir="previews/branch-${branch_path}"
          staging_dir="staging/pr-${{ github.event.pull_request.number }}"

          cd pages-content
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          max_attempts=3
          attempt=1
          while [ "${attempt}" -le "${max_attempts}" ]; do
            git fetch origin pages-content
            git checkout --detach origin/pages-content

            if [ ! -d "${preview_dir}" ]; then
              echo "Cannot find ${preview_dir}; nothing to promote."
              exit 1
            fi

            rm -rf "${staging_dir}"
            mkdir -p "$(dirname "${staging_dir}")"
            cp -R "${preview_dir}" "${staging_dir}"

            git add -A
            if git diff --cached --quiet; then
              echo "No staging changes to commit."
              exit 0
            fi

            git commit -m "ci: promote ${preview_dir} to ${staging_dir}"
            if git push origin HEAD:pages-content; then
              exit 0
            fi

            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "Failed to push promoted staging after ${max_attempts} attempts."
              exit 1
            fi

            echo "Push failed on attempt ${attempt}; retrying with latest pages-content."
            attempt=$((attempt + 1))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build the static site directory: copy pages-content without .git (Pages deploys files only).
      - name: Assemble site from pages content
        run: |
          rm -rf site
          mkdir -p site
          cp -R pages-content/. site/
          rm -rf site/.git

      # Package the site for GitHub Pages (required input for deploy-pages).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # Publish the assembled site to GitHub Pages (serves staging + all other content).
      - name: Deploy merged staging to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # Remove staging folders for PRs that are no longer open (e.g. closed unmerged).
  # Runs after promote-merged-preview (success or failure). Only redeploys when
  # we actually removed something and the promote job did not succeed.
  # ---------------------------------------------------------------------------
  cleanup-orphaned-staging:
    if: always() && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: promote-merged-preview
    concurrency:
      group: pages-content
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    environment:
      name: github-pages
      url: ${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      # If pages-content doesn't exist yet, this job effectively no-ops (continue-on-error).
      - name: Checkout pages content branch
        id: checkout_pages_content
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: pages-content
          fetch-depth: 0
          path: pages-content

      # Get the list of open PR numbers; staging/pr-* dirs not in this list are orphaned.
      - name: List open pull requests
        id: open_prs
        uses: actions/github-script@v7
        with:
          script: |
            const openPulls = await github.paginate(
              github.rest.pulls.list,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              }
            );
            const numbers = openPulls.map(pr => String(pr.number));
            core.setOutput('numbers', numbers.join(' '));

      # Delete staging/pr-<n> for each n not in the open PR list; push with retry (up to 3 attempts).
      - name: Remove orphaned staging pages
        id: prune_staging
        if: steps.checkout_pages_content.outcome == 'success'
        shell: bash
        run: |
          cd pages-content
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          open_numbers=" ${{ steps.open_prs.outputs.numbers }} "
          max_attempts=3
          attempt=1
          while [ "${attempt}" -le "${max_attempts}" ]; do
            git fetch origin pages-content
            git checkout --detach origin/pages-content

            changed=false
            shopt -s nullglob
            for dir in staging/pr-*; do
              [ -d "${dir}" ] || continue
              pr_number="${dir#staging/pr-}"
              if [[ "${open_numbers}" != *" ${pr_number} "* ]]; then
                echo "Removing orphaned staging page ${dir}"
                rm -rf "${dir}"
                changed=true
              fi
            done

            if [ "${changed}" != true ]; then
              echo "No orphaned staging pages found."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git add -A
            if git diff --cached --quiet; then
              echo "No tracked staging changes to commit."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "ci: remove orphaned staging pages"
            if git push origin HEAD:pages-content; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "Failed to push orphaned staging cleanup after ${max_attempts} attempts."
              exit 1
            fi

            echo "Push failed on attempt ${attempt}; retrying with latest pages-content."
            attempt=$((attempt + 1))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild site only when we removed orphans and promote didn't already deploy.
      - name: Assemble site from pages content
        if: steps.prune_staging.outputs.changed == 'true' && needs.promote_merged_preview.result != 'success'
        run: |
          rm -rf site
          mkdir -p site
          cp -R pages-content/. site/
          rm -rf site/.git

      - name: Upload Pages artifact
        if: steps.prune_staging.outputs.changed == 'true' && needs.promote_merged_preview.result != 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # Redeploy so the live site no longer serves removed staging folders.
      - name: Deploy updated Pages content
        if: steps.prune_staging.outputs.changed == 'true' && needs.promote_merged_preview.result != 'success'
        id: deployment
        uses: actions/deploy-pages@v4
