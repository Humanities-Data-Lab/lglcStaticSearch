name: PR Preview Pages

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment-feature-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Add or update PR preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- staticsearch-feature-preview -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const branch = context.payload.pull_request.head.ref;
            const safeBranch = branch.replace(/\//g, '-');
            const shortSha = context.payload.pull_request.head.sha.slice(0, 7);
            const previewUrl = `https://${owner}.github.io/${repo}/previews/branch-${safeBranch}/search.html`;
            const body = `${marker}
            Feature preview is ready: ${previewUrl}

            Branch: \`${branch}\`
            Commit: \`${shortSha}\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });
            }

  promote-merged-preview:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: pages-content
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ format('https://{0}.github.io/{1}/staging/pr-{2}/search.html', github.repository_owner, github.event.repository.name, github.event.pull_request.number) }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Checkout pages content branch
        uses: actions/checkout@v4
        with:
          ref: pages-content
          fetch-depth: 0
          path: pages-content

      - name: Promote branch preview to staging
        run: |
          safe_branch="$(echo "${{ github.event.pull_request.head.ref }}" | tr '/' '-')"
          preview_dir="previews/branch-${safe_branch}"
          staging_dir="staging/pr-${{ github.event.pull_request.number }}"

          cd pages-content
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [ ! -d "${preview_dir}" ]; then
            echo "Cannot find ${preview_dir}; nothing to promote."
            exit 1
          fi

          rm -rf "${staging_dir}"
          mkdir -p "$(dirname "${staging_dir}")"
          cp -R "${preview_dir}" "${staging_dir}"

          git add -A
          if git diff --cached --quiet; then
            echo "No staging changes to commit."
          else
            git commit -m "ci: promote ${preview_dir} to ${staging_dir}"
            git push origin HEAD:pages-content
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble site from pages content
        run: |
          rm -rf site
          mkdir -p site
          cp -R pages-content/. site/
          rm -rf site/.git

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy merged staging to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Update comment with staging URL
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- staticsearch-pr-preview -->';
            const prNumber = context.payload.pull_request.number;
            const shortSha = (context.payload.pull_request.merge_commit_sha || '').slice(0, 7);
            const stagingUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/staging/pr-${prNumber}/search.html`;
            const body = `${marker}
            PR merged. Staging build is ready: ${stagingUrl}

            Merge commit: \`${shortSha}\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }
