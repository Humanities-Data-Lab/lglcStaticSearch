name: PR Preview Pages

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install --yes ant

      - name: Build preview content
        run: ant -f build.xml test

      - name: Assemble preview site directory
        run: |
          rm -rf preview-site
          mkdir -p preview-site
          cp -R test/. preview-site/

      - name: Deploy preview to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./preview-site
          destination_dir: previews/pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Post or update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- staticsearch-pr-preview -->';
            const prNumber = context.payload.pull_request.number;
            const shortSha = context.payload.pull_request.head.sha.slice(0, 7);
            const previewUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/previews/pr-${prNumber}/search.html`;
            const body = `${marker}
            Preview is ready: ${previewUrl}

            Commit: \`${shortSha}\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        id: checkout_gh_pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Remove preview directory
        if: steps.checkout_gh_pages.outcome == 'success'
        run: |
          target="previews/pr-${{ github.event.pull_request.number }}"
          if [ -d "${target}" ]; then
            rm -rf "${target}"
          else
            echo "No preview directory found at ${target}."
          fi

          if [ -d previews ] && [ -z "$(ls -A previews)" ]; then
            rmdir previews
          fi

      - name: Commit and push preview cleanup
        if: steps.checkout_gh_pages.outcome == 'success'
        run: |
          if git diff --quiet -- .; then
            echo "No preview cleanup changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: remove PR preview #${{ github.event.pull_request.number }}"
          git push origin gh-pages

      - name: Update preview comment on close
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- staticsearch-pr-preview -->';
            const prNumber = context.payload.pull_request.number;
            const body = `${marker}
            Preview removed because this PR is closed.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            }
